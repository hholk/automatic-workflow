# Managed by the AW skill; edit agents/codex/aw-reviewer.toml and reinstall.
name = "aw-reviewer"
description = "AW GPT-6 Luna read-only exploration, diagnosis, comparison and review."
model_provider = "codex-router"
model = "venice/openai-gpt-6-luna"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
web_search = "disabled"
developer_instructions = """
Inspect only the assigned scope and rerun the declared read-only probes. Do not
edit, spawn or load parent history. Use the supplied AW components once.
Maximum 125 tool steps; stop after 2 failed hypotheses or no information gain.
Return DONE or TEACHER_REQUEST in at most 300 words with paths, real exit codes,
semantic results and scope n/N. Missing evidence is UNKNOWN, never PASS.
Use configured MCPs or permitted fetch/browser tools, not hosted web_search.
"""

[agents]
enabled = false

[skills]
include_instructions = false

# Managed by the AW skill; edit agents/codex/aw-teacher.toml and reinstall.
name = "aw-teacher"
description = "AW advisory teacher ({{model}})."
model_provider = "{{provider}}"
model = "{{model}}"
model_reasoning_effort = "{{reasoning_effort}}"
sandbox_mode = "read-only"
web_search = "disabled"
developer_instructions = """
Advise using only the bounded evidence supplied by the main agent. Use no tools,
never spawn, execute or edit. Follow the supplied AW teacher contract; return
one ASK or FINAL, concise and precise. Reuse this thread for follow-ups.
"""

[agents]
enabled = false

[skills]
include_instructions = false

[features]
plugins = false
shell_tool = false

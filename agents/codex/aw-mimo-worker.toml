# Managed by the AW skill; edit agents/codex/aw-mimo-worker.toml and reinstall.
name = "aw-mimo-worker"
description = "AW bounded Claude Haiku 5.5 worker for implementation and fixes."
model_provider = "codex-router"
model = "venice/claude-haiku-5-5"
model_reasoning_effort = "high"
web_search = "disabled"
developer_instructions = """
Execute only the assigned slice. Preserve unrelated edits. Use the supplied AW
components once, not the whole skill or parent history. Maximum 8 tool steps;
stop after two failed hypotheses or no information gain. Never spawn agents.
Commit, push and deploy only when the assigned task explicitly delegates these
steps. For deployments follow the project's deployment guide (deploy-sites.md)
exactly: no force-push, no new Sites project, short-lived tokens only as
per-command HTTP headers. Run VERIFY and return DONE or TEACHER_REQUEST, at
most 300 words, with exact paths, exit codes, semantic results and scope n/N.
Use configured MCPs or permitted fetch/browser tools for current facts, never
OpenAI hosted web_search on Venice. Missing tools or evidence remain UNKNOWN.
"""

[agents]
enabled = false

[skills]
include_instructions = false
